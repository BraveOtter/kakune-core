apiVersion: kakune/v1
kind: Workflow
metadata:
  id: write-note
  name: Write note
triggers:
  - id: manual
    type: kakune.trigger.manual@1
entry: write-note
nodes:
  - id: write-note
    type: kakune.fs.write-text@1
    inputs:
      path: { literal: notes/hello.txt }
      content: { literal: Hello from Kakune }
