name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-13, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Check formatting
        if: matrix.os == 'ubuntu-22.04'
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build distributable binary
        run: cargo build --release --locked --bin kakune
      - name: Validate source package
        if: matrix.os == 'ubuntu-22.04'
        run: cargo package --locked

  supply-chain:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Audit known Rust vulnerabilities
        run: cargo install cargo-audit --locked && cargo audit --deny warnings
      - name: Check dependency sources, bans, and licenses
        run: cargo install cargo-deny --locked && cargo deny check advisories bans licenses sources
