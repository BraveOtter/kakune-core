name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Verify tag version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match Cargo version $version" }
      - name: Test
        run: cargo test --locked
      - name: Build distributable binary
        run: cargo build --release --locked --bin kakune
      - name: Package archive
        shell: pwsh
        run: |
          $version = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          ./scripts/package-release.ps1 -Version $version -OutputDirectory release-artifacts
      - name: Smoke packaged archive
        shell: pwsh
        run: ./scripts/smoke-release.ps1 -AssetPath (Get-ChildItem release-artifacts -File | Select-Object -First 1).FullName
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release-artifacts
          format: spdx-json
          output-file: release-artifacts/kakune-core-${{ matrix.os }}.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kakune-core-${{ matrix.os }}
          path: release-artifacts/
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem release-artifacts -File | Where-Object { $_.Name -match '\.(zip|tar\.gz)$' } | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release-artifacts/SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release-artifacts/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* --generate-notes
